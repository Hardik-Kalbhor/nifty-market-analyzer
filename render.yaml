services:
  - type: web
    name: nifty-news-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
